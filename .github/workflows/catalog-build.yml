            }
            const body = {schema:'helio_catalog_artifact_v1',repository:s.repository,repository_id:s.repository_id,workflow_path:s.workflow_path,commit:s.commit,name,value,digest:hash(value)};
            const tag = await api('POST', path(s) + '/git/tags', {tag:'helio/catalog/' + name,message:canonical(body),object:s.commit,type:'commit'});
            if (!shaOK(tag.sha)) fail('record_ref');
            try { await api('POST', path(s) + '/git/refs', {ref:'refs/tags/helio/catalog/' + name,sha:tag.sha}); }
            catch (e) {
              if (![409,422].includes(e.status)) throw e;
              const winner = await read(api, s, name, name.startsWith('target-locks/'));
              if (exclusive) fail(name.startsWith('target-locks/') ? 'target_locked' : 'build_uncertain');
              if (!winner || canonical(winner.value) !== canonical(value)) fail('record_conflict');
              return winner;
