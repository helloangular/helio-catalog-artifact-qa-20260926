          async function complete(api,s,plan,target,observed) {
            await assertPlan(api,s,plan,target);
            const intent=await read(api,s,scopedName('intents',s,target));
            const lock=await read(api,s,'target-locks/'+targetKey(target),true);
            if(!intent || !lock || lock.value.operation_id!==intent.value.operation_id)fail('target_owner_changed');
            const value=intent.value;
            if(observed?.operation_id!==value.operation_id || observed.environment!==target ||
                observed.observed_artifact_digest!==value.artifact.artifact_digest)fail('deployment_verification');
            await put(api,s,scopedName('receipts',s,target),{...value,observed_artifact_digest:observed.observed_artifact_digest});
            await unlock(api,s,target,value.operation_id);
            return value;
          }
          async function main({github,context,core},phase) {
            const e=process.env;
            const workflow=(e.GITHUB_WORKFLOW_REF||'').slice((e.GITHUB_REPOSITORY||'').length+1).split('@')[0];
            const s={repository:e.GITHUB_REPOSITORY,repository_id:String(context.payload.repository.id),workflow_path:workflow,commit:e.GITHUB_SHA,run_id:e.GITHUB_RUN_ID,run_attempt:Number(e.GITHUB_RUN_ATTEMPT)};
            const api=async(method,url,body)=> (await github.request(method+' '+url,{...body,request:{timeout:10000}})).data;
            let p;try{p=JSON.parse(e.CATALOG_PLAN);}catch{fail('plan_invalid');}
            const target=e.TARGET_ENVIRONMENT||'',selection=e.SELECTED_ENVIRONMENT||'';
            let result;
            if(phase==='resolve')result=await resolve(api,s,p,selection);
            else if(phase==='publish'){
              const artifact=JSON.parse(require('node:fs').readFileSync(e.RESULT_FILE,'utf8'));
              result={artifact:await publish(api,s,artifact)};
            } else if(phase==='prepare')result=await prepare(api,s,p,target,selection);
            else if(phase==='complete'){
              const observed=JSON.parse(require('node:fs').readFileSync(e.RESULT_FILE,'utf8'));
              result=await complete(api,s,p,target,observed);
            } else fail('phase_invalid');
            for(const [key,value]of Object.entries(result||{}))core.setOutput(key,typeof value==='object'?canonical(value):String(value));
            if(result.artifact)for(const [key,value]of Object.entries(result.artifact))core.setOutput(key,value);
          }
          module.exports={canonical,hash,validatePlan,validateArtifact,resolve,publish,prepare,complete,main};

          })(loaded);
          await loaded.exports.main({github, context, core}, 'publish');
        retries: 0
      env:
        RESULT_FILE: ${{ runner.temp }}/helio-build-result-${{ github.run_id }}-${{ github.run_attempt }}.json
      if: ${{ steps.resolve.outputs.build_required == 'true' }}
