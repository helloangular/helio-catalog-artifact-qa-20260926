            if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(s.repository || '') ||
                !/^[1-9][0-9]{0,19}$/.test(s.repository_id || '') || !shaOK(s.commit) ||
                !/^[1-9][0-9]{0,19}$/.test(s.run_id || '') || !/^\.github\/workflows\/[A-Za-z0-9_.-]+\.ya?ml$/.test(s.workflow_path || '') ||
                !Number.isSafeInteger(s.run_attempt) || s.run_attempt < 1) fail('scope_invalid');
          }
