          const buildIntentName = s => 'build-intents/' + hash(s.workflow_path) + '/' + s.commit;
          const planName = s => 'plans/' + s.run_id;
          const targetKey = target => hash(target);
          const scopedName = (kind,s,target) => `${kind}/${s.run_id}/${s.run_attempt}/${targetKey(target)}`;
