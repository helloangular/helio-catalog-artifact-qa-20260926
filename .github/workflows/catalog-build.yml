name: Catalog immutable artifact
'on':
  workflow_call:
    inputs:
      helio_execution_id:
        type: string
        required: false
        default: ''
        description: ''
      helio_target_environment:
        type: string
        required: false
        default: ''
        description: Empty for normal fan-out; exact catalog key for deployment-only recovery
      build_runner:
        type: string
        required: false
        default: '["self-hosted","helio-catalog-artifact-qa"]'
        description: ''
      image_repository:
        type: string
        required: false
        default: ''
        description: ''
      build_adapter:
        type: string
        required: false
        default: cicd/helio-build.sh
        description: ''
    outputs:
      artifact_uri:
        value: ${{ jobs.artifact.outputs.artifact_uri }}
      artifact_digest:
        value: ${{ jobs.artifact.outputs.artifact_digest }}
      build_version:
        value: ${{ jobs.artifact.outputs.build_version }}
permissions:
  contents: write
  packages: write
jobs:
  artifact:
    name: Resolve immutable artifact
    runs-on: ${{ fromJSON(inputs.build_runner) }}
    outputs:
      artifact_uri: ${{ steps.resolve.outputs.artifact_uri || steps.publish.outputs.artifact_uri }}
      artifact_digest: ${{ steps.resolve.outputs.artifact_digest || steps.publish.outputs.artifact_digest }}
      build_version: ${{ steps.resolve.outputs.build_version || steps.publish.outputs.build_version }}
    env:
      CATALOG_PLAN: ${{ vars.HELIO_ENVIRONMENTS }}
      SELECTED_ENVIRONMENT: ${{ inputs.helio_target_environment }}
